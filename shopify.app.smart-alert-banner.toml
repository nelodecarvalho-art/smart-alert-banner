# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9e0bbaf4b75c1b59fe25aed45a31cc48"
application_url = "https://smart-alert-banner.onrender.com/app"
embedded = true
name = "smart-alert-banner"

[access_scopes]
scopes = "read_themes"

[auth]
redirect_urls = [
  "https://smart-alert-banner.onrender.com/auth/callback",
  "https://smart-alert-banner.onrender.com/auth/shopify/callback",
  "https://smart-alert-banner.onrender.com/api/auth"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri    = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri    = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri    = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri    = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri    = "/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = false
